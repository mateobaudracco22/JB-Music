<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - JB Music</title>
    <link rel="icon" href="../img/logoJBmusic.png" type="image/png">
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
    <section class="caja">
        <h1>JB Music</h1>
        <p>Ingresá tus datos para entrar</p>

        <form id="formularioLogin">
            <label for="nom">Nombre:</label>
            <input type="text" id="nom" required>

            <label for="ape">Apellido:</label>
            <input type="text" id="ape" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="tel">Teléfono:</label>
            <input type="tel" id="tel">

            <button type="submit">Ingresar</button>
            <button type="reset">Resetear</button>
        </form>

        <a href="nuevo_index.html" class="volver">← Volver al inicio</a>
    </section>

    <script src="formulario.js"></script>
</body>
</html>
